name: Debug Structure

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Show full directory structure
      run: |
        echo "=== Current directory ==="
        pwd
        echo ""
        echo "=== Root directory contents ==="
        ls -la
        echo ""
        echo "=== Find all gradlew files ==="
        find . -name "gradlew" -type f 2>/dev/null
        echo ""
        echo "=== Find all build.gradle files ==="
        find . -name "build.gradle*" -type f 2>/dev/null
        echo ""
        echo "=== Complete tree structure (first 3 levels) ==="
        find . -type d -maxdepth 3 | sort
        echo ""
        echo "=== Check if FlagGuesser folder exists ==="
        if [ -d "FlagGuesser" ]; then
          echo "FlagGuesser folder exists, contents:"
          ls -la FlagGuesser/
        else
          echo "FlagGuesser folder NOT found in root"
        fi
        echo ""
        echo "=== Check if there's any gradle wrapper jar ==="
        find . -name "gradle-wrapper.jar" -type f 2>/dev/null
