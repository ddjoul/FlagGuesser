name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    # Unit tests
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace
    
    # Generate test reports
    - name: Publish Unit Test Results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Unit Tests
        path: app/build/test-results/testDebugUnitTest/*.xml
        reporter: java-junit
    
    # Build APK for Firebase Test Lab
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    
    # Upload APK as artifact (before Firebase tests)
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    # Setup gcloud CLI
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        export_default_credentials: true
    
    # Run Firebase Test Lab instrumentation tests
    - name: Run Firebase Test Lab
      run: |
        gcloud firebase test android run \
          --type instrumentation \
          --app app/build/outputs/apk/debug/app-debug.apk \
          --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
          --device model=Pixel4,version=30,locale=en_US,orientation=portrait \
          --device model=Nexus6,version=29,locale=en_US,orientation=landscape \
          --timeout 15m \
          --results-bucket cloud-test-results-${{ secrets.GCP_PROJECT_ID }} \
          --results-dir=instrumentation/${{ github.run_id }}
    
    # Download and process Firebase test results
    - name: Download Firebase Test Results
      if: always()
      run: |
        mkdir -p test-results/firebase
        gcloud storage cp --recursive \
          gs://cloud-test-results-${{ secrets.GCP_PROJECT_ID }}/instrumentation/${{ github.run_id }} \
          test-results/firebase/
    
    # Upload Firebase test results as artifacts
    - name: Upload Firebase Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: firebase-test-results
        path: test-results/firebase/
        retention-days: 14
    
    # Build Release APK (production)
    - name: Build Release APK
      run: ./gradlew assembleRelease
    
    # Sign and prepare release APK
    - name: Sign Release APK
      if: github.ref == 'refs/heads/main'
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
    
    # Upload final release artifact
    - name: Upload Release APK
      uses: actions/upload-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        name: flagguesser-release-${{ github.run_number }}
        path: app/build/outputs/apk/release/app-release-signed.apk
        retention-days: 90
    
    # Create GitHub Release
    - name: Create Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        files: app/build/outputs/apk/release/app-release-signed.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Separate job for UI tests with Firebase Test Lab (Parallel)
  firebase-ui-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download APK artifact
      uses: actions/download-artifact@v3
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/
    
    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
    
    - name: Run Robo Test
      run: |
        gcloud firebase test android run \
          --type robo \
          --app app/build/outputs/apk/debug/app-debug.apk \
          --device model=Pixel5,version=31,locale=en_US,orientation=portrait \
          --robo-directives activity=com.example.flagguesser.MainActivity \
          --timeout 10m \
          --results-bucket cloud-test-results-${{ secrets.GCP_PROJECT_ID }} \
          --results-dir=robo/${{ github.run_id }}
